services:
  app:
    build: .
    image: student-placement-system:latest
    container_name: placement-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_RATE_LIMIT=30
      - GIT_SHA=${GIT_SHA:-local}
    volumes:
      - placement-data:/app/data      # keeps store.json across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Optional reverse proxy:  docker compose --profile proxy up
  nginx:
    image: nginx:alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  placement-data:
