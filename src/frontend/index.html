<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Placement Portal | 4-Panel Enterprise System</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Remix Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <!-- Fullscreen Login & Signup Screen Overlay -->
  <div class="login-screen-overlay" id="loginScreen">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">
          <i class="ri-graduation-cap-fill"></i>
        </div>
        <h2>PLACEMENT PORTAL</h2>
        <p>Access your campus recruitment account</p>
      </div>

      <!-- Auth Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabSignIn" onclick="App.switchAuthTab('signin')">Sign In</button>
        <button class="auth-tab-btn" id="tabSignUp" onclick="App.switchAuthTab('signup')">Create Account (Sign Up)</button>
      </div>

      <!-- 1. SIGN IN FORM -->
      <div id="signInContainer">
        <!-- Quick Demo Login Presets -->
        <div class="demo-credentials-box">
          <div class="demo-title"><i class="ri-flash-line"></i> Quick Demo Login (1-Click)</div>
          <div class="demo-btn-grid">
            <button class="demo-pill-btn" onclick="App.fillDemoLogin('admin@campus.edu', 'admin123')">
              <span class="demo-role">System Admin</span>
              <span class="demo-email">admin@campus.edu</span>
            </button>
            <button class="demo-pill-btn" onclick="App.fillDemoLogin('tpo@campus.edu', 'tpo123')">
              <span class="demo-role">TPO Officer</span>
              <span class="demo-email">tpo@campus.edu</span>
            </button>
            <button class="demo-pill-btn" onclick="App.fillDemoLogin('s.jenkins@google.com', 'recruiter123')">
              <span class="demo-role">Google Recruiter</span>
              <span class="demo-email">s.jenkins@google.com</span>
            </button>
            <button class="demo-pill-btn" onclick="App.fillDemoLogin('rahul.sharma@campus.edu', 'student123')">
              <span class="demo-role">Student (Rahul)</span>
              <span class="demo-email">rahul.sharma@campus.edu</span>
            </button>
          </div>
        </div>

        <form onsubmit="App.handleLoginForm(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="user@campus.edu" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.8rem;">
            <label style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); cursor: pointer;">
              <input type="checkbox" checked> Remember session
            </label>
            <a href="#" onclick="showToast('Password reset link sent to registered email', 'info')" style="color: var(--primary); text-decoration: none;">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
            <i class="ri-login-box-line"></i> Sign In to Portal
          </button>
        </form>
      </div>

      <!-- 2. SIGN UP FORM -->
      <div id="signUpContainer" style="display: none;">
        <form onsubmit="App.handleSignupForm(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g. Vikramaditya Singh" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="vikram@campus.edu" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Create strong password" required>
          </div>
          <div class="form-group">
            <label>Account Persona / Role</label>
            <select id="regRole" class="form-control" onchange="App.handleRegRoleChange()">
              <option value="student" selected>Student Candidate</option>
              <option value="recruiter">Company Recruiter</option>
              <option value="tpo">Placement Officer (TPO)</option>
              <option value="admin">System Administrator</option>
            </select>
          </div>

          <!-- Dynamic Student Fields -->
          <div id="regStudentFields">
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div>
                <label>Branch</label>
                <select id="regBranch" class="form-control">
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics & Comm">Electronics & Comm</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                </select>
              </div>
              <div>
                <label>Current CGPA</label>
                <input type="number" step="0.1" id="regCgpa" class="form-control" value="8.0">
              </div>
            </div>
          </div>

          <!-- Dynamic Recruiter Fields -->
          <div id="regRecruiterFields" style="display: none;">
            <div class="form-group">
              <label>Company Name</label>
              <input type="text" id="regCompanyName" class="form-control" placeholder="e.g. Oracle / Salesforce / IBM">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px;">
            <i class="ri-user-add-line"></i> Complete Registration
          </button>
        </form>
      </div>

    </div>
  </div>

  <!-- Top Header Navigation -->
  <header class="top-header">
    <div class="brand">
      <div class="brand-icon">
        <i class="ri-graduation-cap-fill"></i>
      </div>
      <div class="brand-text">
        <h1>CAMPUS PLACEMENT SYSTEM</h1>
        <p>Training & Placement Cell • Batch 2026</p>
      </div>
    </div>

    <div class="header-actions">
      <!-- 4-Role Persona Switcher -->
      <div class="role-switcher-box">
        <label for="roleSelect"><i class="ri-swap-line"></i> Quick Persona:</label>
        <select id="roleSelect" class="role-select">
          <optgroup label="1. Admin Panel">
            <option value="admin" selected>Admin: Dr. V. K. Sharma (Director)</option>
          </optgroup>
          <optgroup label="2. Placement Officer (TPO) Panel">
            <option value="tpo">TPO: Prof. Archana Rao (TPO Head)</option>
          </optgroup>
          <optgroup label="3. Company / Recruiter Panel">
            <option value="recruiter_google">Recruiter: Sarah Jenkins (Google HR)</option>
            <option value="recruiter_microsoft">Recruiter: Rajesh Kumar (Microsoft HR)</option>
          </optgroup>
          <optgroup label="4. Student Panel">
            <option value="STU001">Student: Rahul Sharma (CSE • 8.75 CGPA)</option>
            <option value="STU002">Student: Priya Patel (IT • 9.20 CGPA)</option>
            <option value="STU003">Student: Amit Verma (ECE • 7.40 CGPA)</option>
            <option value="STU004">Student: Ananya Roy (CSE • 8.10 CGPA)</option>
            <option value="STU005">Student: Rohan Gupta (ME • 6.90 CGPA)</option>
            <option value="STU006">Student: Sneha Kulkarni (CSE • 9.50 CGPA)</option>
          </optgroup>
        </select>
      </div>

      <!-- User Info Badge -->
      <div class="user-badge" id="currentUserBadge">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-info">
          <span class="user-name" id="userName">Dr. V. K. Sharma</span>
          <span class="user-role-label" id="userRoleLabel">System Director</span>
        </div>
      </div>

      <!-- Logout Button -->
      <button class="btn btn-secondary btn-sm" onclick="App.handleLogout()" title="Sign Out">
        <i class="ri-logout-box-r-line"></i> Logout
      </button>
    </div>
  </header>

  <!-- App Main Container -->
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div id="sidebarMenu">
        <!-- Rendered dynamically by app.js based on selected role -->
      </div>
    </aside>

    <!-- Main Workspace View Container -->
    <main class="main-content" id="mainContent">
      <div id="viewContainer">
        <!-- Dynamic Views loaded by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Reusable Modal Window Overlay -->
  <div class="modal-overlay" id="globalModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle">Modal Title</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Form or dynamic detail content -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/tpo.js"></script>
  <script src="js/recruiter.js"></script>
  <script src="js/student.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
